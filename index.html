<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Курсы валют и криптовалют</title>
    <link rel="preconnect" href="https://api.bybit.com" />
    <link rel="preconnect" href="https://iss.moex.com" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="dashboard">
      <section class="topbar" aria-labelledby="page-title">
        <div>
          <h1 id="page-title">Курсы валют</h1>
        </div>
        <div class="actions">
          <span id="last-updated" class="timestamp">Загрузка...</span>
          <button id="refresh-button" type="button" aria-label="Обновить курсы">
            <span aria-hidden="true">↻</span>
            Обновить
          </button>
        </div>
      </section>

      <section id="rate-grid" class="rate-grid" aria-label="Ключевые курсы"></section>

      <section class="add-panel" aria-label="Добавить валюту">
        <button id="toggle-add-button" type="button">+ Добавить валюту</button>
        <form id="add-form" class="add-form" hidden>
          <select id="symbol-select" aria-label="Выбор фьючерса Bybit">
            <option value="">Загружаю список Bybit...</option>
          </select>
          <button id="add-symbol-button" type="submit">Добавить</button>
          <button id="hide-add-button" class="secondary-button" type="button">Скрыть</button>
          <span id="add-status" class="add-status"></span>
        </form>
      </section>

      <section class="table-panel" aria-label="Таблица курсов">
        <div class="panel-heading">
          <h2>Таблица</h2>
          <span id="status-pill">Подключение</span>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Актив</th>
                <th>Пара</th>
                <th>Last price</th>
                <th>Mark price</th>
                <th>Изменение 24ч</th>
                <th>График</th>
              </tr>
            </thead>
            <tbody id="rates-table">
              <tr>
                <td colspan="6">Загружаю курсы...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
